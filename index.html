<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b4a">
<title>Canteen Order Hub Mplace</title>

<style>
:root{--g:#176b4a;--l:#e8f4ed;--bg:#f5f8f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#18231f;font:15px Arial}
header{background:linear-gradient(120deg,#124c37,#23865d);color:white;padding:20px}
.brand{font-size:22px;font-weight:bold}
nav,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:9px;padding:11px 14px;background:var(--g);color:white;font-weight:bold;cursor:pointer}
nav button{background:#ffffff25}
nav button.active{background:white;color:var(--g)}
main{max-width:1000px;margin:auto;padding:14px}
.panel{background:white;border:1px solid #e3eae5;border-radius:14px;padding:16px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.food{border:1px solid #ddd;border-radius:12px;padding:9px;overflow:hidden}
.food img{width:100%;height:125px;object-fit:cover;border-radius:9px;background:var(--l)}
.food h3{font-size:14px;margin:8px 0 4px}
.food p{font-size:12px;margin:5px 0}
.price{color:var(--g);font-weight:bold;font-size:16px}
.food button{width:100%;padding:9px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:white}
label{display:block;margin:12px 0 5px;font-weight:bold}
.hidden{display:none!important}
.tabs button{background:var(--l);color:var(--g)}
.tabs button.active{background:var(--g);color:white}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #ddd}
.order{border:1px solid #ddd;border-radius:10px;padding:13px;margin-top:12px;overflow-wrap:anywhere}
.full{width:100%;margin-top:8px}
.secondary{background:var(--l);color:var(--g)}
.danger{background:#ffeaea;color:#b93838}
.notice{padding:12px;border-radius:9px;background:var(--l);margin:10px 0}
.muted{color:#68756e;font-size:12px}
.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#fff0d5;font-size:12px}
.status.ok{background:#dff3e5;color:green}
.actions button{flex:1}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>

<body>
<header>
 <div class="brand">🍽️ Canteen Order Hub Mplace</div>
 <p>created by Anjo Esparas • Order Online • Canteen Menu</p>
 <nav>
  <button onclick="showPage('shop')">Menu</button>
  <button onclick="showPage('cart')">🛒 Cart (<span id="cartCount">0</span>)</button>
  <button onclick="showPage('admin')">Admin</button>
 </nav>
</header>

<main>
<section id="shopPage">
 <div class="panel">
  <h2>Today's Menu</h2>
  <div id="connectionStatus" class="notice">Connecting...</div>
  <div id="canteenTabs" class="tabs"></div>
  <div id="menuGrid" class="grid"></div>
 </div>
</section>

<section id="cartPage" class="hidden">
 <div class="panel">
  <h2>🛒 My Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: ₱0.00</h3>
  <button class="full" onclick="showPage('checkout')">Checkout</button>
  <button class="secondary full" onclick="showPage('shop')">Continue Shopping</button>
 </div>
</section>

<section id="checkoutPage" class="hidden">
 <div class="panel">
  <h2>Customer Information</h2>
  <label>Full Name</label>
  <input id="custName" placeholder="Your name">
  <label>Cellphone Number</label>
  <input id="custPhone" type="tel" placeholder="09XXXXXXXXX">
  <label>Payment Method</label>
  <select id="payment"><option>Cash</option><option>GCash</option></select>
  <label>Note</label>
  <input id="custNote" placeholder="Optional">
  <div id="checkoutSummary"></div>
  <button id="submitOrderBtn" class="full" onclick="placeOrder()">SUBMIT ORDER</button>
  <button class="secondary full" onclick="showPage('cart')">Back</button>
 </div>
</section>

<section id="adminPage" class="hidden">
 <div id="adminLogin" class="panel">
  <h2>Admin Login</h2>
  <label>Admin PIN</label>
  <input type="password" id="adminPin" placeholder="Enter PIN">
  <button class="full" onclick="loginAdmin()">Login</button>
 </div>
 <div id="adminDash" class="panel hidden">
  <h2>Admin Dashboard</h2>
  <div class="tabs">
   <button onclick="adminTab('orders')">📦 Orders</button>
   <button onclick="adminTab('manage')">🍽️ Manage Menu</button>
  </div>
  <div id="ordersAdmin"></div>
  <div id="manageAdmin" class="hidden"></div>
  <button class="secondary full" onclick="logoutAdmin()">Logout</button>
 </div>
</section>

<section id="successPage" class="hidden">
 <div class="panel">
  <h2> Order Submitted!</h2>
  <p>Your order has been saved.</p>
  <div id="successOrderId"></div>
  <button class="full" onclick="showPage('shop')">Back to Menu</button>
 </div>
</section>
</main>

<script>
// SETTINGS
const ADMIN_PIN="0966";
const SHEET_URL="https://script.google.com/macros/s/AKfycbzG_AWtDctxFfWzOMh3MWxWY7yQ5hQ98IUJkOlXpgY9dF8_JYBoF6SW33nKvNV5h2UH4Q/exec";
const MENU_KEY="canteen_menu";
const ORDER_KEY="canteen_orders";

// MENU
const defaultMenu=[
["1","Chicken Adobo",55,"Canteen 1","🍗","01-chicken-adobo"],
["2","Pork Menudo",50,"Canteen 1","🍲","02-pork-menudo"],
["3","Tortang Talong",35,"Canteen 1","🍆","03-tortang-talong"],
["4","Fried Chicken",60,"Canteen 2","🍗","04-fried-chicken"],
["5","Pancit Bihon",30,"Canteen 2","🍜","05-pancit-bihon"],
["6","Tapsilog",65,"Canteen 2","🍳","06-tapsilog"],
["7","Adobong Baboy",65,"Canteen 1","🥘","07-adobong-baboy"],
["8","Adobong Manok",60,"Canteen 1","🍗","08-adobong-manok"],
["9","Menudo",55,"Canteen 1","🍲","09-menudo"],
["10","Afritada",60,"Canteen 1","🍛","10-afritada"],
["11","Caldereta",75,"Canteen 1","🍖","11-caldereta"],
["12","Mechado",70,"Canteen 1","🥩","12-mechado"],
["13","Bicol Express",65,"Canteen 2","🌶️","13-bicol-express"],
["14","Sisig",70,"Canteen 2","🍳","14-sisig"],
["15","Dinuguan",55,"Canteen 2","🍲","15-dinuguan"],
["16","Pork Steak / Bistek Tagalog",60,"Canteen 2","🥩","16-pork-steak-bistek"],
["17","Lechon Kawali",75,"Canteen 2","🥓","17-lechon-kawali"],
["18","Tokwa't Baboy",50,"Canteen 2","🍢","18-tokwa-at-baboy"],
["19","Lumpiang Shanghai",40,"Canteen 1","🥟","19-lumpiang-shanghai"],
["20","Chicken Curry",65,"Canteen 1","🍛","20-chicken-curry"],
["21","Tinola",55,"Canteen 2","🍲","21-tinola"],
["22","Pork Binagoongan",60,"Canteen 2","🍲","22-pork-binagoongan"],
["23","Igado",60,"Canteen 1","🍢","23-igado"],
["24","Coke",20,"Canteen 1","🥤","24-coke"],
["25","Royal",20,"Canteen 1","🥤","25-royal"],
["26","Sprite",20,"Canteen 1","🥤","26-sprite"],
["27","Saging",10,"Canteen 1","🍌","27-saging"]
].map(x=>({
 id:x[0],name:x[1],price:x[2],canteen:x[3],
 emoji:x[4],image:"images/"+x[5]+".jpg",available:true
}));

function readStorage(k,f){
 try{return JSON.parse(localStorage.getItem(k))||f}
 catch(e){return f}
}
let menu=readStorage(MENU_KEY,defaultMenu);
let orders=readStorage(ORDER_KEY,[]);
let cart=[],currentCanteen="All",isAdmin=false;

function saveData(){
 localStorage.setItem(MENU_KEY,JSON.stringify(menu));
 localStorage.setItem(ORDER_KEY,JSON.stringify(orders));
}
function peso(n){return "₱"+Number(n||0).toFixed(2)}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function sid(v){return "'"+String(v).replace(/['\\]/g,"\\$&")+"'"}

// GOOGLE SHEETS
async function apiGet(type){
 let r=await fetch(SHEET_URL+"?type="+encodeURIComponent(type));
 if(!r.ok)throw Error("Server connection failed");
 let d=await r.json();
 if(!Array.isArray(d))throw Error(d.message||"Invalid response");
 return d;
}
async function apiPost(data){
 let r=await fetch(SHEET_URL,{
  method:"POST",
  body:JSON.stringify(data)
 });
 let d=await r.json();
 if(!["success","updated","deleted"].includes(d.result))
  throw Error(d.message||"Request failed");
 return d;
}
async function syncMenu(){
 try{
  let remote=await apiGet("menu");
  if(remote.length){
   menu=remote.map(x=>{
    let old=menu.find(y=>String(y.id)===String(x.id));
    return {...old,...x,id:String(x.id),
     price:Number(x.price),
     available:x.available===true,
     image:x.image||(old&&old.image)||""};
   });
  }else{
   for(let x of defaultMenu)
    await apiPost({action:"addFood",...x});
   menu=defaultMenu.map(x=>({...x}));
  }
  saveData();
  renderMenu();
  document.getElementById("connectionStatus").textContent=" Connected to Google Sheets";
 }catch(e){
  document.getElementById("connectionStatus").textContent="⚠️ Offline mode: showing saved menu.";
 }
}

// NAVIGATION
function showPage(p){
 ["shop","cart","checkout","admin","success"].forEach(x=>
  document.getElementById(x+"Page").classList.toggle("hidden",x!==p)
 );
 if(p==="shop")renderMenu();
 if(p==="cart")renderCart();
 if(p==="checkout")renderCheckout();
 if(p==="admin")renderAdmin();
 window.scrollTo(0,0);
}

// MENU DISPLAY
function setCanteen(n){currentCanteen=n;renderMenu()}
function renderMenu(){
 let names=["All",...new Set(menu.map(x=>x.canteen))];
 document.getElementById("canteenTabs").innerHTML=names.map(n=>`
  <button class="${n===currentCanteen?"active":""}"
   onclick="setCanteen('${esc(n)}')">
   ${n==="All"?"All Canteens":esc(n)}
  </button>`).join("");

 let items=menu.filter(x=>currentCanteen==="All"||x.canteen===currentCanteen);

 document.getElementById("menuGrid").innerHTML=items.map(x=>`
  <div class="food">
   <img src="${esc(x.image||"")}" alt="${esc(x.name)}"
    onerror="this.style.display='none'">
   <h3>${esc(x.name)}</h3>
   <p>${esc(x.canteen)}</p>
   <p class="price">${peso(x.price)}</p>
   <p>${x.available?" Available":" Sold Out"}</p>
   <button ${x.available?"":"disabled"} onclick="addCart(${sid(x.id)})">Add to Cart</button>
  </div>`).join("");
}

// CART
function addCart(id){
 let x=menu.find(y=>String(y.id)===String(id));
 if(!x||!x.available)return;
 let c=cart.find(y=>String(y.id)===String(id));
 if(c)c.qty++;else cart.push({id:String(id),qty:1});
 updateCount();
 alert("Added to cart!");
}
function updateCount(){
 document.getElementById("cartCount").textContent=
 cart.reduce((s,x)=>s+x.qty,0);
}
function renderCart(){
 let total=0;
 let html=cart.map(c=>{
  let x=menu.find(y=>String(y.id)===String(c.id));
  if(!x)return "";
  total+=x.price*c.qty;
  return `<div class="item">
   <div><b>${esc(x.name)}</b><br>${peso(x.price)} × ${c.qty}</div>
   <div class="actions">
    <button onclick="changeQty(${sid(x.id)},-1)">−</button>
    <button onclick="changeQty(${sid(x.id)},1)">+</button>
    <button class="danger" onclick="removeCart(${sid(x.id)})">×</button>
   </div>
  </div>`;
 }).join("");
 document.getElementById("cartItems").innerHTML=html||"<p>Wala pang laman ang cart mo.</p>";
 document.getElementById("cartTotal").textContent="Total: "+peso(total);
}
function changeQty(id,n){
 let c=cart.find(x=>String(x.id)===String(id));
 if(!c)return;
 c.qty+=n;
 if(c.qty<=0)removeCart(id);
 else renderCart();
 updateCount();
}
function removeCart(id){
 cart=cart.filter(x=>String(x.id)!==String(id));
 renderCart();updateCount();
}

// CHECKOUT
function renderCheckout(){
 let total=0;
 let html=cart.map(c=>{
  let x=menu.find(y=>String(y.id)===String(c.id));
  if(!x)return "";
  total+=x.price*c.qty;
  return `<p>${esc(x.name)} × ${c.qty}: ${peso(x.price*c.qty)}</p>`;
 }).join("");
 document.getElementById("checkoutSummary").innerHTML=
 html+"<h3>Total: "+peso(total)+"</h3>";
}
async function placeOrder(){
 let name=document.getElementById("custName").value.trim();
 let phone=document.getElementById("custPhone").value.trim();
 if(!name||!phone||!cart.length){
  alert("Pakilagay ang pangalan, number at order.");return;
 }
 let items=[];
 for(let c of cart){
  let x=menu.find(y=>String(y.id)===String(c.id));
  if(!x||!x.available){alert("May item na hindi na available.");return}
  items.push({name:x.name,canteen:x.canteen,price:x.price,qty:c.qty});
 }
 let total=items.reduce((s,x)=>s+x.price*x.qty,0);
 let o={
  action:"createOrder",id:"ORD-"+Date.now(),
  name,phone,
  payment:document.getElementById("payment").value,
  note:document.getElementById("custNote").value.trim(),
  items,total,status:"Pending",date:new Date().toISOString()
 };
 let b=document.getElementById("submitOrderBtn");
 b.disabled=true;b.textContent="Submitting...";
 try{
  await apiPost(o);
  orders.unshift(o);saveData();
  cart=[];updateCount();
  document.getElementById("custName").value="";
  document.getElementById("custPhone").value="";
  document.getElementById("custNote").value="";
  document.getElementById("successOrderId").innerHTML="Order ID: <b>"+esc(o.id)+"</b>";
  showPage("success");
 }catch(e){alert("Hindi na-save ang order: "+e.message)}
 finally{b.disabled=false;b.textContent="SUBMIT ORDER"}
}

// ADMIN
function loginAdmin(){
 if(document.getElementById("adminPin").value===ADMIN_PIN){
  isAdmin=true;
  document.getElementById("adminPin").value="";
  renderAdmin();
 }else alert("Wrong PIN!");
}
function logoutAdmin(){isAdmin=false;renderAdmin()}
function renderAdmin(){
 document.getElementById("adminLogin").classList.toggle("hidden",isAdmin);
 document.getElementById("adminDash").classList.toggle("hidden",!isAdmin);
 if(isAdmin)adminTab("orders");
}
function adminTab(t){
 document.getElementById("ordersAdmin").classList.toggle("hidden",t!=="orders");
 document.getElementById("manageAdmin").classList.toggle("hidden",t!=="manage");
 if(t==="orders")renderOrders();
 if(t==="manage")renderManage();
}
async function renderOrders(){
 let el=document.getElementById("ordersAdmin");
 el.innerHTML="<p>Loading orders...</p>";
 try{orders=await apiGet("orders");saveData()}
 catch(e){el.innerHTML="<div class='notice'>Cannot load orders: "+esc(e.message)+"</div>";return}
 if(!orders.length){el.innerHTML="<p>Wala pang orders.</p>";return}
 el.innerHTML=[...orders].reverse().map(o=>`
  <div class="order">
   <h3>${esc(o.id)}</h3>
   <p><b>${esc(o.name)}</b></p>
   <p>Phone: ${esc(o.phone)}</p>
   <p>Payment: ${esc(o.payment)}</p>
   <p>Note: ${esc(o.note||"None")}</p>
   <p>Status: <span class="status">${esc(o.status)}</span></p>
   ${(Array.isArray(o.items)?o.items:[]).map(i=>`
    <p>${Number(i.qty)} × ${esc(i.name)} - ${peso(i.price*i.qty)}</p>
   `).join("")}
   <h3>${peso(o.total)}</h3>
   <p class="muted">${esc(o.date)}</p>
   <div class="actions">
    ${o.status==="Pending"?`<button onclick="setStatus(${sid(o.id)},'Confirmed')">Confirm</button>`:""}
    ${o.status==="Confirmed"?`<button onclick="setStatus(${sid(o.id)},'Preparing')">Preparing</button>`:""}
    ${o.status==="Preparing"?`<button onclick="setStatus(${sid(o.id)},'Ready')">Ready</button>`:""}
    ${o.status==="Ready"?`<button onclick="setStatus(${sid(o.id)},'Completed')">Completed</button>`:""}
    <button class="danger" onclick="deleteOrder(${sid(o.id)})">Delete</button>
   </div>
  </div>`).join("");
}
async function setStatus(id,status){
 try{
  await apiPost({action:"updateStatus",id,status});
  let o=orders.find(x=>String(x.id)===String(id));
  if(o)o.status=status;
  saveData();renderOrders();
 }catch(e){alert(e.message)}
}
async function deleteOrder(id){
 if(!confirm("Delete this order permanently?"))return;
 try{
  await apiPost({action:"deleteOrder",id});
  orders=orders.filter(x=>String(x.id)!==String(id));
  saveData();renderOrders();
 }catch(e){alert(e.message)}
}

// MENU MANAGEMENT
function renderManage(){
 document.getElementById("manageAdmin").innerHTML=`
  <h3>➕ Add Food</h3>
  <label>Food Name</label><input id="newName" placeholder="Food name">
  <label>Price</label><input id="newPrice" type="number" min="0.01" placeholder="Price">
  <label>Canteen</label>
  <select id="newCanteen"><option>Canteen 1</option><option>Canteen 2</option></select>
  <label>Photo (optional)</label><input id="newImage" type="file" accept="image/*">
  <button class="full" onclick="addFood()">Add Food</button>
  <hr><h3>Current Menu (${menu.length})</h3>
  ${menu.map(x=>`
   <div class="order">
    ${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}" style="width:100%;max-height:140px;object-fit:cover;border-radius:9px;margin-bottom:8px">`:""}
    <b>${esc(x.emoji)} ${esc(x.name)}</b>
    <p>${peso(x.price)}</p>
    <p>${esc(x.canteen)} | ${x.available?"Available":" Sold Out"}</p>
    <input type="file" accept="image/*" class="hidden" id="img_${esc(x.id)}" onchange="uploadImage(${sid(x.id)},this.files[0])">
    <div class="actions">
     <button onclick="editFood(${sid(x.id)})">Edit</button>
     <button class="secondary" onclick="document.getElementById('img_${esc(x.id)}').click()">${x.image?"Change Photo":"Add Photo"}</button>
     <button class="secondary" onclick="toggleFood(${sid(x.id)})">${x.available?"Sold Out":"Available"}</button>
     <button class="danger" onclick="deleteFood(${sid(x.id)})">Delete</button>
    </div>
   </div>`).join("")}`;
}
async function addFood(){
 let name=document.getElementById("newName").value.trim();
 let price=Number(document.getElementById("newPrice").value);
 let canteen=document.getElementById("newCanteen").value;
 let file=document.getElementById("newImage").files[0];
 if(!name||!Number.isFinite(price)||price<=0){alert("Enter valid food name and price.");return}
 let image="";
 if(file){
  image=await new Promise(res=>{
   let r=new FileReader();
   r.onload=()=>res(r.result);
   r.readAsDataURL(file);
  });
 }
 let x={id:"FOOD-"+Date.now(),name,price,canteen,emoji:"🍽️",available:true,image};
 menu.push(x);saveData();renderManage();renderMenu();
 alert("Food successfully added!");
 try{await apiPost({action:"addFood",...x})}catch(e){}
}

function uploadImage(id,file){
 if(!file)return;
 let reader=new FileReader();
 reader.onload=function(){
  let x=menu.find(y=>String(y.id)===String(id));
  if(!x)return;
  x.image=reader.result;
  saveData();renderManage();renderMenu();
 };
 reader.readAsDataURL(file);
}
async function editFood(id){
 let x=menu.find(y=>String(y.id)===String(id));
 if(!x)return;
 let name=prompt("Food name:",x.name);
 if(name===null)return;
 let price=Number(prompt("Price:",x.price));
 if(!name.trim()||!Number.isFinite(price)||price<=0){alert("Invalid name or price.");return}
 x.name=name.trim();x.price=price;
 saveData();renderManage();renderMenu();
 try{await apiPost({action:"editFood",id:x.id,name:x.name,price:x.price})}catch(e){}
}
async function toggleFood(id){
 let x=menu.find(y=>String(y.id)===String(id));
 if(!x)return;
 x.available=!x.available;
 saveData();renderManage();renderMenu();
 try{await apiPost({action:"toggleFood",id:x.id})}catch(e){}
}
async function deleteFood(id){
 if(!confirm("Delete this food?"))return;
 menu=menu.filter(x=>String(x.id)!==String(id));
 cart=cart.filter(x=>String(x.id)!==String(id));
 saveData();updateCount();renderManage();renderMenu();
 try{await apiPost({action:"deleteFood",id})}catch(e){}
}

// START
renderMenu();
updateCount();
syncMenu();
</script>
</body>
</html>
